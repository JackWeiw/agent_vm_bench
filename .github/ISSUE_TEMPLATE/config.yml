# https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
blank_issues_enabled: false
contact_links:
  - name: Read the documentation
    url: https://github.com/JackWeiw/agent_vm_bench#readme
    about: Start with the README and the docs/ guides before filing an issue.
  - name: Ask a question (Discussions)
    url: https://github.com/JackWeiw/agent_vm_bench/discussions
    about: Q&A and usage questions belong in Discussions, not the issue tracker.
  - name: Contributing guide
    url: https://github.com/JackWeiw/agent_vm_bench/blob/main/CONTRIBUTING.md
    about: How to set up the dev environment, run tests, and open a pull request.
  - name: Propose a major change (RFC)
    url: https://github.com/JackWeiw/agent_vm_bench/blob/main/docs/rfcs/README.md
    about: For architecture or workflow changes that need design discussion first.
  - name: Report a security vulnerability
    url: https://github.com/JackWeiw/agent_vm_bench/security/advisories/new
    about: Report security issues privately here, not via a public issue.
