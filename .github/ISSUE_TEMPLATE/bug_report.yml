name: Bug report
description: Report something that isn't working as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill in the fields below.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands that trigger the bug.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package / scenario
      options:
        - OpenStack VM (auto_vm_test / vm_bench)
        - E2B Sandbox (e2b_bench)
        - Docker Container (docker_bench)
        - llm_replay
        - vm_monitor
        - Other / cross-cutting
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. Ubuntu 22.04, Python 3.10, x86_64 / ARM64.
      placeholder: OS, Python version, architecture
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config snippet
      description: Minimal YAML config that reproduces the issue (redact secrets).
      render: yaml
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Error output or test_log.txt excerpts. Paste text, don't screenshot.
      render: shell
    validations:
      required: false
