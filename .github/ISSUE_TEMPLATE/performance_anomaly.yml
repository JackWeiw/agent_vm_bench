name: Performance / benchmark anomaly
description: Benchmark numbers look off — unexpected latency, QPS drop, or metric anomaly.
title: "[perf] "
labels: ["performance", "needs-triage"]
body:
  - type: dropdown
    id: scenario
    attributes:
      label: Benchmark scenario
      options:
        - OpenStack VM memory overcommit (fixed / batch)
        - E2B Sandbox - fixed mode
        - E2B Sandbox - round-robin mode
        - Docker container bench
        - llm_replay
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed vs expected
      description: >-
        Which metric(s) are off and what did you expect?
        (e.g. browser_p99_latency_ms, td_mem_bound_percent, ksys_l3_latency_avg)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config snippet
      description: Minimal YAML that reproduces the setup (redact secrets).
      render: yaml
    validations:
      required: true
  - type: textarea
    id: numa
    attributes:
      label: NUMA / monitoring setup
      description: numa_bind, smap_tool, vm_monitor - enabled? which NUMA nodes?
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python, arch, host CPU/RAM if relevant
    validations:
      required: true
  - type: textarea
    id: reports
    attributes:
      label: Relevant reports / logs
      description: Excerpts from bench_report, resource_report.xlsx summary, or test_log.txt.
      render: shell
    validations:
      required: false
