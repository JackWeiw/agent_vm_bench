# Oversubscription sweep: exec_ephemeral (B's no-lifecycle ephemeral model) +
# per-sandbox multiplier M=5, ratios 1:1 / 1:2 / 1:3.
#
# Each trial: k*N sandboxes, each runs exactly M=5 trajectories (create_one ->
# bare exec of the recorded steps -> kill_one, no pause/resume), then self-stops
# (stop-when-done). The driver flips benchmark_mode to fixed and sets
# replay.multiplier per trial; total trajectories = M * k * N. compute_valid
# gates on throughput.succeeded (the trajectory-completion count), NOT
# throughput.total (a sandbox count).
#
# Launch (one short command):
#   oversub-bench --sweep-config config/oversub/exec-ephemeral-1to3.yaml
#
# Override a single knob on the CLI (CLI flags beat this file):
#   oversub-bench --sweep-config config/oversub/exec-ephemeral-1to3.yaml --multiplier 10
#
# Precedence: CLI flag > this file > built-in default (see `oversub-bench --help`).

# Path to the exec_ephemeral stress profile (NOT replay.yaml). The driver
# deep-copies this and only rewrites per-trial oversub fields (total_count,
# running_concurrency, mode, multiplier, round_size, duration, report output).
base_config: config/common/replay-ephemeral.yaml

provider: aenv

# N running slots stays fixed; total_count = N * ratio scales per trial.
# N defaults to base replay.running_concurrency (384 for the aenv 1.5 TiB host).
# running_concurrency: 384   # uncomment to override N

ratios: [1, 2, 3]              # k values: total_count = k * N per trial
modes: [exec_ephemeral]        # ephemeral create_one/kill_one per round, no lifecycle
multiplier: 5                 # per-sandbox M: each slot runs exactly 5 trajectories (fixed + stop-when-done)
repeats: 1                    # repeats per (mode, ratio) for medians

test_duration: 3600           # hard ceiling per trial (sec); exec_ephemeral runs
                              # M*k*N create+exec+kill cycles, scale up if they
                              # don't all finish in-window (compute_valid's
                              # succeeded-floor catches a genuine stall, not a
                              # slow-but-finishing run). null = base test.duration
failure_tolerance: 0.0        # max failure_rate for a trial to count as valid (0.0 = strict)
cooldown_sec: 30              # settle time between trials
cleanup_between_trials: on    # pre-trial teardown of leftovers so they don't corrupt the ratio
# trial_timeout_sec: 0          # omit -> inherits the 6h built-in default (a defense-in-depth
                                # backstop so a hung kernel subprocess cannot block the sweep). 0 = off.
# output_root: null           # null = results/oversub/oversub-N{N}-{timestamp}/

reuse: false                  # skip completed-valid trials (restart safety)
stop_on_failure: false        # halt on first invalid trial
no_vm_monitor: false          # pass --no-vm-monitor through to bench-core
bench_core_bin: [bench-core]  # kernel subprocess command (tests point at a stub)
