# config/common/browser.yaml
# Unified browser benchmark config — E2B backend.
#
# Read by the src kernel (bench_core) + env_provider.e2b adapter. Legacy
# e2b_bench keeps its own config/e2b/bench.yaml (old schema) and is unaffected.
#
# One shape for every backend: the ONLY backend-specific part is the top-level
# ``e2b:`` block below. All shared stress sections (sandbox / create_batch /
# task_batch / browser / test / report / workflow_type) load into KernelConfig
# via KernelConfig.from_raw; the e2b block loads into env_provider.e2b.Config.
#
# Validate without an SDK:
#   PYTHONPATH=src python -m bench_core --provider fake --config config/common/browser.yaml
# Create-only dry run (needs E2B creds):
#   PYTHONPATH=src python -m bench_core --provider e2b --config config/common/browser.yaml --create-only

workflow_type: browser

# === backend block (e2b-only; read by env_provider.e2b.Config.from_raw) ===
e2b:
  template: "openclaw-browser-v1"
  create_timeout: 86400
  # NUMA node(s) to bind sandboxes to.
  #   single node: numa_bind: 2
  #   multi node (round-robin across sandboxes): numa_bind: [2, 3]
  #   null/omit: no binding
  numa_bind: 2
  sandbox_ids_file: "sandboxs.txt"   # save/load sandbox IDs across runs (empty = disabled)
  env:                              # E2B SDK env vars; key/token fall back to ~/.e2b/config.json
    E2B_ACCESS_TOKEN: "your_e2b_access_token_here"
    E2B_API_KEY: "your_e2b_api_key_here"
    E2B_DOMAIN: "e2b.app"
    E2B_API_URL: "http://localhost:3000"
    E2B_HTTP_SSL: "false"

# === shared stress sections (all -> KernelConfig) ===
sandbox:                            # shared sandbox control (creation mode)
  total_count: 100                  # Total sandbox count (creation mode)
  detect_existing: false            # Detect existing sandboxes instead of creating new ones
  create_only: false                # Create sandboxes only without running tasks (Phase 0)

# Sandbox creation batch control (optional, full concurrent if not configured).
# Limits how many sandboxes to create per batch to avoid API/resource overload.
create_batch:
  size: 20                          # Sandboxes per batch during creation
  interval: 3                       # Interval between creation batches (seconds)

# Task execution batch control (optional, full concurrent if not configured).
# Limits how many sandboxes start tasks per batch to avoid target server overload.
task_batch:
  size: 10                          # Sandboxes to start tasks per batch
  interval: 5                       # Interval between task batches (seconds)

# Browser task configuration
browser:
  urls:
    - "http://192.168.110.10:8080/Hubble_Space_Telescope.html"
  task_timeout: 200                 # Browser task timeout (seconds)
  interval_min: 5                   # Task interval minimum (seconds)
  interval_max: 15                  # Task interval maximum (seconds)
  # Warmup configuration (optional, run warmup pages before benchmark)
  warmup_urls:
    - "http://192.168.110.10:8080/China.html"
    - "http://192.168.110.10:8080/Earth.html"
    - "http://192.168.110.10:8080/Galaxy.html"
    - "http://192.168.110.10:8080/Hubble_Space_Telescope.html"
    - "http://192.168.110.10:8080/Human.html"
    - "http://192.168.110.10:8080/List_of_paintings_by_Vincent_van_Gogh.html"
    - "http://192.168.110.10:8080/Solar_System.html"
    - "http://192.168.110.10:8080/United_States.html"
    - "http://192.168.110.10:8080/World_War_II.html"
  warmup_loops: 1                   # Loop count for warmup pages
  warmup_delay: 5                   # Delay between warmup pages (seconds)
  warmup_only: false                # Run warmup phase only, then exit

# Test run configuration
test:
  duration: 160                     # Test duration (seconds)
  stats_interval: 10                # Stats snapshot interval (seconds)
  benchmark_percent: 1.0            # Fraction of sandboxes for benchmark (1.0 = 100%, 0.5 = 50%)
  # Round-robin mode configuration (optional).
  # Tab-switch mode: each round operates on a specific tab (round_id % len(warmup_urls)).
  # - Warmup phase opens N tabs (N = len(warmup_urls))
  # - Round N operates on tab tN, cycling through tabs
  # - Creates swap in events when accessing migrated memory
  benchmark_mode: "round_robin"     # "fixed" (default) or "round_robin"
  # round_size: how many sandboxes per round (group granularity)
  # round_count: max number of rounds (termination condition)
  # duration: test time limit (termination condition)
  # Test stops when round_count OR duration is reached (whichever comes first).
  round_size: 5                     # Sandboxes per round (group_count = ceil(total / round_size))
  round_count: 5                    # Max number of rounds
  round_interval: 5                 # Round interval in seconds (allows time for memory migration)

# Report configuration
report:
  output_dir: "results/e2b"
  filename_prefix: "e2b_bench"
