# config/common/coding-python.yaml
# Unified coding (Python) benchmark config — backend-agnostic (E2B + Docker).
#
# Workflow type: coding — simulates AI coding agent memory pressure.
#   Trace-faithful loop: find -> read -> edit -> verify (python3) -> git diff.
#   Verification is a transient CPython process importing django's module graph
#   (the memory peak the same role `go run`'s compiler and `npx tsx`'s
#   node+esbuild play in the go/ts variants). N sandboxes' verify peaks
#   overlapping -> host memory overcommit.
#
# Project: django/django (github.com/django/django)
#   - Real repo used across swe_bench / swe-bench-verified evaluations. Each
#     pair is a real, type-safe string edit to a verified django framework
#     source file (all under django/). The first pair carries its own
#     verify_script (a bare python3 script importing django and asserting
#     LANGUAGE_CODE).
#
# The replacement pairs are the language's CANONICAL content in
# bench_core.coding_payload -- omit ``source_files`` and
# KernelConfig.__post_init__ fills them from
# CODING_LANGUAGE_DEFAULT_SOURCE_FILES["python"] (6 django pairs, the first with
# its own verify_script), so this file stays minimal.
#
# Pick the backend with --provider; the SAME stress profile runs on either:
#   bench-core --provider e2b    --config config/common/coding-python.yaml --create-only
#   bench-core --provider docker --config config/common/coding-python.yaml --create-only
#
# Validate without any SDK (parses shared sections only):
#   bench-core --provider fake --config config/common/coding-python.yaml --create-only -n 1
#
# Legacy e2b_bench keeps its own config/e2b/coding_python_bench.yaml (old schema); unaffected.

workflow_type: coding

# === backend blocks (one per provider; only the matching one is read) ===
e2b:
  template: "openclaw-coding-python-v1"  # E2B template (coding template with django/django)
  create_timeout: 86400
  numa_bind: 2
  # Firecracker CPU pinning is an aenv-only knob (see the aenv: block below);
  # cloud e2b sandboxes run on e2b's infrastructure, so no pin keys here.
  sandbox_ids_file: "sandboxs_python.txt"  # save/load sandbox IDs across runs (empty = disabled)
  env:                              # E2B SDK env vars; key/token fall back to ~/.e2b/config.json
    E2B_ACCESS_TOKEN: "your_e2b_access_token_here"
    E2B_API_KEY: "your_e2b_api_key_here"
    E2B_DOMAIN: "e2b.app"
    E2B_API_URL: "http://localhost:3000"
    E2B_HTTP_SSL: "false"

aenv:
  template: "openclaw-coding-python-v1"  # AENV snapshot-capable image (same shape)
  create_timeout: 86400
  sandbox_ids_file: "sandboxs_python_aenv.txt"  # save/load sandbox IDs across runs (empty = disabled)
  # Firecracker CPU pinning (cold-start perf, aenv only). Comma-separated host
  # CPU list, e.g. pin_cpus: "2,3" for a 2-vCPU sandbox; null/omit = no
  # pinning. pgrep + taskset run on the AENV server host; pin_cmd_prefix routes
  # them when the bench runs remotely ("" = local, "ssh user@host" = remote).
  # Pin-verify failure fails sandbox creation. Cloud e2b ignores these keys
  # (its sandboxes run on e2b's infrastructure). See
  # src/env_provider/e2b/manager.py (_pin_and_verify_fc).
  pin_cpus: null
  pin_cmd_prefix: ""
  env:                              # AENV server env (E2B SDK pointed at AENV)
    E2B_ACCESS_TOKEN: "your_e2b_access_token_here"
    E2B_API_KEY: "your_e2b_api_key_here"
    E2B_DOMAIN: "your_aenv_domain_here"
    E2B_API_URL: "http://127.0.0.1:8000"      # AENV control plane (POST /sandboxes)
    E2B_SANDBOX_URL: "http://127.0.0.1:8000"  # AENV data plane (envd proxy)

docker:
  # NOTE: no coding image ships today (only ubuntu-openclaw-chromium). Build one
  # that seeds django/django + python3, then point this at it.
  image: "ubuntu-openclaw-coding-python:24.04-arm64"
  container_prefix: "oc-bench"
  cpu_limit: 2.0
  memory_limit: "2g"
  create_timeout: 300
  # Readiness is a workflow concern (coding runs the uname probe, not ports);
  # it is provider-transparent, so there is no port_check block here.

# === shared stress sections (all -> KernelConfig) ===
sandbox:                            # shared sandbox control
  total_count: 10                    # Total sandbox count (start small for manual testing)
  detect_existing: false            # Detect existing sandboxes instead of creating new ones
  create_only: false                # Create sandboxes only without running tasks (Phase 0)

# Sandbox creation batch control
create_batch:
  size: 10                          # Sandboxes per batch during creation
  interval: 3                       # Interval between creation batches (seconds)

# Task execution batch control
task_batch:
  size: 5                           # Sandboxes to start tasks per batch
  interval: 5                       # Interval between task batches (seconds)

# Coding task configuration (host-agnostic; the sandbox runs it).
# source_files omitted -> __post_init__ fills the 6 canonical django pairs.
coding:
  language: "python"               # selects the python verify profile (python3)
  project_dir: "/opt/coding-bench"  # django/django project directory inside sandbox
  verify_cmd: "python3 /tmp/bench_verify.py"  # Verify run command (the profile's run_cmd)
  verify_timeout: 120               # Verify command timeout (seconds)
  verify_repeat: 1                  # python: single import-peak per verify (profile ignores repeat)
  interval_min: 2.0                 # Min interval between tasks (fixed mode)
  interval_max: 10.0                # Max interval between tasks (fixed mode)
  skip_verify: false                # Skip the verify step (set true for edit-only testing)

# Test run configuration
test:
  duration: 160                     # Test duration (seconds)
  stats_interval: 10                # Stats snapshot interval (seconds)
  benchmark_percent: 1.0            # Percentage of sandboxes for benchmark (1.0 = 100%)
  # Round-robin mode configuration (recommended for coding benchmark).
  benchmark_mode: "round_robin"     # "fixed" (default) or "round_robin"
  round_size: 5                     # Sandboxes per round
  round_count: 20                   # Max rounds (stops when reached or duration exceeded)
  round_interval: 3                 # Round interval in seconds

# Report configuration
report:
  output_dir: "results/coding/python"
  filename_prefix: "coding_python_bench"
