# config/e2b_bench.yaml
# E2B Sandbox Batch Performance Test Configuration Template

# E2B SDK environment variables (replace with real credentials)
e2b_env:
  E2B_ACCESS_TOKEN: "your_e2b_access_token_here"
  E2B_API_KEY: "your_e2b_api_key_here"
  E2B_DOMAIN: "e2b.app"
  E2B_API_URL: "http://localhost:3000"
  E2B_HTTP_SSL: "false"

# Workflow type configuration
# "browser" — opens web pages via agent-browser (default)
# "coding"  — simulates AI coding agent: dev server + edit + build + test
workflow:
  type: "browser"

# Coding task configuration (used when workflow.type = "coding")
coding:
  project_dir: "/opt/coding-bench"
  dev_wait: 20                    # Dev server startup wait (seconds)
  build_cmd: "npm run build"
  test_cmd: "npm test"
  dev_cmd: "npm run dev"
  build_timeout: 300              # Build timeout (seconds)
  test_timeout: 120               # Test timeout (seconds)
  interval_min: 2.0               # Min interval between tasks (fixed mode)
  interval_max: 10.0              # Max interval between tasks (fixed mode)
  skip_dev_server: false          # Skip dev server startup
  skip_build: false               # Skip build step
  skip_test: false                # Skip test step
  source_files:
    - "src/pages/dashboard/analysis/index.tsx"
    - "src/pages/dashboard/workplace/index.tsx"
    - "src/pages/dashboard/monitor/index.tsx"
    - "src/pages/form/basic-form/index.tsx"
    - "src/pages/form/step-form/index.tsx"
    - "src/pages/form/advanced-form/index.tsx"
    - "src/pages/list/basic-list/index.tsx"
    - "src/pages/list/card-list/index.tsx"
    - "src/pages/list/search/index.tsx"
    - "src/pages/table-list/index.tsx"
    - "src/pages/profile/basic/index.tsx"
    - "src/pages/profile/advanced/index.tsx"
    - "src/pages/result/success/index.tsx"
    - "src/pages/result/fail/index.tsx"
    - "src/pages/exception/403/index.tsx"
    - "src/pages/exception/404/index.tsx"
    - "src/pages/exception/500/index.tsx"
    - "src/pages/user/login/index.tsx"
    - "src/pages/user/register/index.tsx"
    - "src/pages/account/settings/index.tsx"
    - "src/pages/account/center/index.tsx"
    - "src/pages/chatbot/index.tsx"

# Sandbox configuration
sandbox:
  template: "openclaw-browser-v1"    # E2B template name (used for creation)
  create_timeout: 86400              # Sandbox creation timeout (seconds)
  total_count: 100                   # Total sandbox count (creation mode)
  detect_existing: false             # Detect existing sandboxes instead of creating new ones
  create_only: false                 # Create sandboxes only without running tasks (Phase 0)
  sandbox_ids_file: "sandboxs.txt"               # File path to save/load sandbox IDs (one ID per line, empty = disabled)
  numa_bind: 2                       # NUMA node to bind sandbox (null/omit = no binding)

# Sandbox creation batch control (optional, full concurrent if not configured)
# Controls how many sandboxes to create per batch to avoid API/resource overload
create_batch:
  size: 20                           # Sandboxes per batch during creation
  interval: 3                       # Interval between creation batches (seconds)

# Task execution batch control (optional, full concurrent if not configured)
# Controls how many sandboxes start tasks per batch to avoid target server overload
task_batch:
  size: 10                           # Sandboxes to start tasks per batch
  interval: 5                        # Interval between task batches (seconds)

# Browser task configuration
browser:
  urls:
    - "http://192.168.110.10:8080/Hubble_Space_Telescope.html"
  task_timeout: 200
  interval_min: 5
  interval_max: 15
  # Warmup configuration (optional, run warmup pages before benchmark)
  warmup_urls:
    - "http://192.168.110.10:8080/China.html"
    - "http://192.168.110.10:8080/Earth.html"
    - "http://192.168.110.10:8080/Galaxy.html"
    - "http://192.168.110.10:8080/Hubble_Space_Telescope.html"
    - "http://192.168.110.10:8080/Human.html"
    - "http://192.168.110.10:8080/List_of_paintings_by_Vincent_van_Gogh.html"
    - "http://192.168.110.10:8080/Solar_System.html"
    - "http://192.168.110.10:8080/United_States.html"
    - "http://192.168.110.10:8080/World_War_II.html"
  warmup_loops: 1            # Loop count for warmup pages
  warmup_delay: 5           # Delay between warmup pages (seconds)
  warmup_only: false         # Run warmup phase only, then exit

# Test run configuration
test:
  duration: 160
  stats_interval: 10
  benchmark_percent: 1.0    # Percentage of sandboxes for benchmark (1.0 = 100%, 0.5 = 50%)

  # Round-robin mode configuration (optional)
  # Tab-switch mode: each round operates on a specific tab (round_id % len(warmup_urls))
  # - Warmup phase opens N tabs (N = len(warmup_urls))
  # - Round N operates on tab tN, cycling through tabs
  # - Creates swap in events when accessing migrated memory
  benchmark_mode: "round_robin"   # "fixed" (default) or "round_robin"
  # Both round_count and round_size can coexist:
  # - round_size: determines how many sandboxes per round (group granularity)
  # - round_count: determines max number of rounds to run (termination condition)
  # - duration: test time limit (termination condition)
  # Test stops when round_count OR duration is reached (whichever comes first)
  round_size: 5                   # Sandboxes per round (default: 5, group_count = ceil(total / round_size))
  round_count: 5                  # Max number of rounds (termination condition, stops when reached or duration exceeded)
  round_interval: 5               # Round interval in seconds (allows time for memory migration)

# Report configuration
report:
  output_dir: "results/e2b"
  filename_prefix: "e2b_bench"
